services:
  leetproof:
    image: lloom-ase2026-artifact:latest
    build:
      context: .
      args:
        LLOOM_UID: ${LLOOM_UID:-1000}
        LLOOM_GID: ${LLOOM_GID:-1000}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    stdin_open: true
    tty: true
    volumes:
      # Generated Lean files, results, logs, and sessions persist in the
      # artifact directory after the container exits.
      - ./llmgen-experiment:/workspace/llmgen-experiment
      # Keep pricing corrections immediately visible without rebuilding the
      # image. The image still contains a fallback copy of this file.
      - ./leetproof/config/model_pricing.json:/opt/leetproof/config/model_pricing.json:ro
      # LeanExplore data and Hugging Face models downloaded by `setup` persist
      # across disposable `docker compose run --rm` containers.
      - lloom-home:/home/lloom

volumes:
  lloom-home:
